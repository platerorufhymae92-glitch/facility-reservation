<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Requester - Facility Reservation System</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 20px auto; padding: 0 12px; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
    th, td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; }
    th { background: #f0f0f0; }
    .error { color: red; }
    .ok { color: green; }
  </style>
</head>
<body>
  <p id="checking">Checking access...</p>

  <div id="content" style="display: none;">
    <h1>Requester Dashboard</h1>
    <p>Logged in as: <b id="who"></b> <button onclick="logout()">Logout</button></p>

    <h2>Facilities</h2>
    <table>
      <thead><tr><th>Name</th><th>Location</th><th>Capacity</th><th>Status</th></tr></thead>
      <tbody id="facilityRows"></tbody>
    </table>

    <h2>Submit Reservation Request</h2>
    <form id="reserveForm">
      <p>Facility:<br /><select id="facilitySelect" required></select></p>
      <p>Purpose:<br /><input type="text" id="purpose" required style="width: 300px;" /></p>
      <p>Start:<br /><input type="datetime-local" id="startTime" required /></p>
      <p>End:<br /><input type="datetime-local" id="endTime" required /></p>
      <p><button type="submit">Submit Request</button></p>
    </form>
    <p id="message"></p>

    <h2>My Reservations (History)</h2>
    <table>
      <thead><tr><th>Facility</th><th>Purpose</th><th>Start</th><th>End</th><th>Status</th><th>Action</th></tr></thead>
      <tbody id="reservationRows"></tbody>
    </table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let currentProfile = null;

    function cell(text) {
      const td = document.createElement("td");
      td.textContent = text;
      return td;
    }

    function showMessage(text, isError) {
      const msg = document.getElementById("message");
      msg.textContent = text;
      msg.className = isError ? "error" : "ok";
    }

    async function loadFacilities() {
      const { data, error } = await db.from("facilities").select("*").order("name");
      if (error) { showMessage("Load facilities failed: " + error.message, true); return; }

      const rows = document.getElementById("facilityRows");
      const select = document.getElementById("facilitySelect");
      rows.innerHTML = "";
      select.innerHTML = "";

      data.forEach((f) => {
        const tr = document.createElement("tr");
        tr.append(cell(f.name), cell(f.location || ""), cell(f.capacity ?? ""), cell(f.status));
        rows.appendChild(tr);

        const opt = document.createElement("option");
        opt.value = f.id;
        opt.textContent = f.name + " (" + f.status + ")";
        select.appendChild(opt);
      });
    }

    async function loadReservations() {
      const { data, error } = await db
        .from("reservations")
        .select("*, facilities(name)")
        .eq("requester_id", currentProfile.id)
        .order("created_at", { ascending: false });

      if (error) { showMessage("Load reservations failed: " + error.message, true); return; }

      const rows = document.getElementById("reservationRows");
      rows.innerHTML = "";

      data.forEach((r) => {
        const tr = document.createElement("tr");
        tr.append(
          cell(r.facilities ? r.facilities.name : ""),
          cell(r.purpose),
          cell(new Date(r.start_time).toLocaleString()),
          cell(new Date(r.end_time).toLocaleString()),
          cell(r.status)
        );

        const actionTd = document.createElement("td");
        if (r.status === "Pending") {
          const btn = document.createElement("button");
          btn.textContent = "Cancel";
          btn.onclick = () => cancelReservation(r.id);
          actionTd.appendChild(btn);
        }
        tr.appendChild(actionTd);
        rows.appendChild(tr);
      });
    }

    async function cancelReservation(id) {
      if (!confirm("Cancel this reservation request?")) return;
      const { error } = await db.from("reservations").update({ status: "Cancelled" }).eq("id", id);
      if (error) { showMessage("Cancel failed: " + error.message, true); return; }
      showMessage("Reservation cancelled.", false);
      loadReservations();
    }

    document.getElementById("reserveForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      showMessage("", false);

      const start = new Date(document.getElementById("startTime").value);
      const end = new Date(document.getElementById("endTime").value);

      if (start >= end) {
        showMessage("Start time must be before end time.", true);
        return;
      }

      const { error } = await db.from("reservations").insert({
        facility_id: document.getElementById("facilitySelect").value,
        requester_id: currentProfile.id,
        purpose: document.getElementById("purpose").value,
        start_time: start.toISOString(),
        end_time: end.toISOString(),
        status: "Pending"
      });

      if (error) { showMessage("Submit failed: " + error.message, true); return; }

      showMessage("Reservation submitted! Status: Pending", false);
      document.getElementById("reserveForm").reset();
      loadReservations();
    });

    requireRole(["requester"]).then((profile) => {
      if (!profile) return;
      currentProfile = profile;
      document.getElementById("who").textContent = profile.email + " (" + profile.role + ")";
      loadFacilities();
      loadReservations();
    });
  </script>
</body>
</html>
